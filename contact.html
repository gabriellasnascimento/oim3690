<form class="form" action="https://www.google.com/search" method="GET">
  <div class="row">
    <div class="field">
      <label for="name">Name</label>
      <input
        id="name"
        name="name"
        type="text"
        value="Gabriella Nascimento"
        required
      />
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        value="2005gabriella@gmail.com"
        required
      />
    </div>
  </div>

  <div class="field">
    <label for="message">Message (demo: this will search Google)</label>
    <textarea
      id="message"
      name="q"
      rows="6"
      placeholder="Type anything here..."
      required
    ></textarea>
  </div>

  <button class="btn" type="submit">Submit</button>
</form>
